<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Checkout</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 40px auto;
        padding: 20px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 24px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      }
      label,
      button {
        display: block;
        width: 100%;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        background: #008cff;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .message {
        margin-top: 18px;
        padding: 14px;
        border-radius: 8px;
      }
      .message.error {
        background: #ffe3e6;
        color: #a50000;
      }
      .message.success {
        background: #e5f7eb;
        color: #0f6a23;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Razorpay Standard Checkout</h1>
      <p>Enter the payment amount and click Pay to launch Razorpay checkout.</p>
      <label for="amount">Amount (₹)</label>
      <input type="number" step="0.01" id="amount" value="1.00" min="1" />
      <button id="pay-button">Pay Now</button>
      <div id="status" class="message" style="display:none"></div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="./checkout.js"></script>
  </body>
</html>
